[project]
name = "sql-opd"
version = "0.1.0"
description = "sql-opd: single-turn text-to-SQL prompts from JSONL (DuckDB), execution-match reward."
requires-python = ">=3.11"
dependencies = ["duckdb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sql_opd"]
