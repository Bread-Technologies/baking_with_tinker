# Generated by the 2B sweep launcher; see HILLCLIMB.md
# On-policy distillation: Qwen3.5-2B student <- Qwen3.5-397B-A17B teacher (Tinker, via shim on :8001).
# Proxy track: BIRD + Spider train prompts only (no TPC-H schema). Dev = held-out Spider DBs.
max_steps = 200
seq_len = 12288

[model]
# Untied copy: prime-rl does not re-tie lm_head for tied Qwen3.5 checkpoints (see modal_prime.untie)
name = "/data/models/Qwen3.5-2B-untied"

[orchestrator]
batch_size = 128          # rollouts per step (32 prompts x group_size 4)

[orchestrator.train]
group_size = 4

[orchestrator.train.algo]
type = "opd"

[orchestrator.train.algo.teacher]
name = "Qwen/Qwen3.5-397B-A17B"
base_url = "http://127.0.0.1:8001/v1"

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = true

[orchestrator.train.sampling]
max_completion_tokens = 6144
temperature = 1.0

[[orchestrator.train.source]]
name = "sql-train"
env.taskset.id = "sql-opd"
env.taskset.data_path = "/data/target_train_split.jsonl"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 25

[orchestrator.eval.select]
limit = 150

[orchestrator.eval.sampling]
max_completion_tokens = 10240
temperature = 1.0

[[orchestrator.eval.source]]
name = "target-dev"
env.taskset.id = "sql-opd"
env.taskset.data_path = "/data/target_dev.jsonl"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 2e-4

[trainer.model.lora]
rank = 32

[ckpt]
interval = 25

[inference]

[inference.vllm]
gpu_memory_utilization = 0.85
